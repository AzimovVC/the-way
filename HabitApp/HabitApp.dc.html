<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Habit app screen" description="Streaky mobile shell: metric top bar, chapter banner, habit path, glyph tab bar." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0;background:var(--surface-sunken);display:grid;place-items:start center;min-height:100vh}</style></helmet>
<div style="position:relative;width:440px;min-height:880px;display:flex;flex-direction:column;background:#0E1014;border-radius:28px;overflow:hidden;border:1px solid #363C48;font-family:'Figtree',system-ui,sans-serif">
<header style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px">
<x-import component-from-global-scope="StreakyDesignSystem_c771a6.MetricChip" icon="flame" value="{{ streak }}" color="#FF6B45" hint-size="70px,34px"></x-import>
<x-import component-from-global-scope="StreakyDesignSystem_c771a6.MetricChip" icon="gem" value="865" color="#3D8BFF" hint-size="80px,34px"></x-import>
<x-import component-from-global-scope="StreakyDesignSystem_c771a6.MetricChip" icon="moon" value="2" color="#9B6BFF" hint-size="60px,34px"></x-import>
<x-import component-from-global-scope="StreakyDesignSystem_c771a6.IconButton" icon="settings" size="sm" tone="plain" label="Settings" hint-size="36px,36px"></x-import>
</header>
<main style="flex:1;padding:0 16px 32px">
<x-import component-from-global-scope="StreakyDesignSystem_c771a6.UnitBanner" eyebrow="Week 4 · Mornings" title="Build a wake-up routine" color="#2ED3B7" hint-size="100%,76px"></x-import>
<div style="display:grid;gap:24px;justify-items:center;padding:32px 0 20px">
<sc-for list="{{ path }}" as="node" hint-placeholder-count="5">
<x-import component-from-global-scope="StreakyDesignSystem_c771a6.HabitNode" icon="{{ node.icon }}" label="{{ node.label }}" state="{{ node.state }}" offset="{{ node.offset }}" current="{{ node.current }}" hint-size="120px,120px"></x-import>
</sc-for>
</div>
<x-import component-from-global-scope="StreakyDesignSystem_c771a6.Button" tone="neutral" variant="outline" iconLeft="plus" fullWidth="{{ true }}" hint-size="100%,52px">Add a habit</x-import>
</main>
<x-import component-from-global-scope="StreakyDesignSystem_c771a6.TabBar" items="{{ tabs }}" value="{{ tab }}" onChange="{{ setTab }}" hint-size="100%,72px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:880},&quot;streak&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:999,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  state = { tab: 'today' };
  renderVals() {
    return {
      streak: this.props.streak ?? 12,
      tab: this.state.tab,
      setTab: (t) => this.setState({ tab: t }),
      tabs: [
        { id: 'today', icon: 'house', label: 'Today', color: '#FFC93D' },
        { id: 'quests', icon: 'target', label: 'Quests', color: '#3D8BFF' },
        { id: 'stats', icon: 'chart-column', label: 'Stats', color: '#2ED3B7' },
        { id: 'friends', icon: 'users', label: 'Friends', color: '#F2547D', badge: true },
        { id: 'more', icon: 'ellipsis', label: 'More', color: '#9B6BFF' },
      ],
      path: [
        { icon: 'droplet', label: 'Drink water', state: 'done', offset: -58 },
        { icon: 'activity', label: 'Stretch 5 min', state: 'done', offset: 0 },
        { icon: 'dumbbell', label: 'Workout', state: 'active', offset: 58, current: true },
        { icon: 'book-open', label: 'Read 10 pages', state: 'locked', offset: 0 },
        { icon: 'pen-line', label: 'Evening pages', state: 'locked', offset: -58 },
      ],
    };
  }
}
</script>
</body>
</html>
